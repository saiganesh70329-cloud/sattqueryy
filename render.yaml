services:
  - type: web
    name: satquery-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: satquery-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: satquery-postgres
    databaseName: satquery
    user: satquery
    plan: 0.1c-256mb
    region: singapore
